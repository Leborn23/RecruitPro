[project]
name = "recruitment-agent"
version = "0.1.0"
description = "Stateful Recruitment Interview Agent"
authors = [
    {name = "AI Agent Engineer"}
]
dependencies = [
    "langgraph>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "openai>=1.40.0",
    "langsmith>=0.1.125",
    "anthropic>=0.30.0",
    "google-generativeai>=0.7.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.0.0"
]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
markers = [
    "real_llm: tests that call a real LLM provider and are skipped unless RUN_REAL_LLM_SMOKE=1",
]
filterwarnings = [
    "ignore:langsmith\\.wrappers\\._openai_agents is deprecated and has been moved to langsmith\\.integrations\\.openai_agents_sdk:DeprecationWarning",
]
