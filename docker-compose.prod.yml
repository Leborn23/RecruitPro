name: recruitpro-prod

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      AGENT_GATEWAY_HOST: 0.0.0.0
      AGENT_GATEWAY_PORT: "8000"
      AGENT_CHECKPOINT_BACKEND: sqlite
      AGENT_CHECKPOINT_SQLITE_PATH: /app/artifacts/checkpoints/interview.sqlite
      AGENT_WORKER_COUNT: "1"
    volumes:
      - ./agent/artifacts:/app/artifacts
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.production
    environment:
      FASTAPI_PORT: "8010"
      AGENT_BASE_URL: http://agent:8000
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - agent
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env.production and run docker-compose with --env-file .env.production}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY in .env.production and run docker-compose with --env-file .env.production}
        VITE_FASTAPI_BASE_URL: ${VITE_FASTAPI_BASE_URL:-/api-fast}
        VITE_SCREENING_USE_BACKEND: ${VITE_SCREENING_USE_BACKEND:-true}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
