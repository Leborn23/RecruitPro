name: recruitpro

services:
  agent:
    build:
      context: ../agent/recruitment-agent
      dockerfile: Dockerfile
    env_file:
      - ../agent/recruitment-agent/.env
    environment:
      AGENT_GATEWAY_HOST: 0.0.0.0
      AGENT_GATEWAY_PORT: "8000"
      AGENT_CHECKPOINT_BACKEND: sqlite
      AGENT_CHECKPOINT_SQLITE_PATH: /app/artifacts/checkpoints/interview.sqlite
      AGENT_WORKER_COUNT: "1"
    ports:
      - "8000:8000"
    volumes:
      - ../agent/recruitment-agent/artifacts:/app/artifacts

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.local
    environment:
      FASTAPI_PORT: "8010"
      AGENT_BASE_URL: http://agent:8000
    ports:
      - "8010:8010"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8010 --reload
    depends_on:
      - agent

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.local
    environment:
      VITE_FASTAPI_PROXY_TARGET: http://backend:8010
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
